<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- آیکون موقت «پوسته نقشه» — طومار نقشه گنج. قرار است با طرح نهایی جایگزین شود. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f0dcba"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeed6"/>
      <stop offset="1" stop-color="#dfc096"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5a2f12" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#soft)" stroke="#b5673a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- تنه طومار -->
    <path d="M52 62 H204 V194 H52 Z" fill="url(#paper)"/>
    <!-- لوله بالا و پایین -->
    <rect x="34" y="40" width="188" height="34" rx="17" fill="url(#roll)"/>
    <rect x="34" y="182" width="188" height="34" rx="17" fill="url(#roll)"/>
  </g>
  <!-- برق روی لوله‌ها -->
  <rect x="50" y="47" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.7"/>
  <rect x="50" y="189" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
  <!-- مسیر نقطه‌چین تا علامت گنج -->
  <path d="M78 156 C96 120 116 150 132 118 S166 104 172 100" fill="none" stroke="#c98a4a" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <circle cx="78" cy="158" r="9" fill="#e9a54b" stroke="#b5673a" stroke-width="5"/>
  <path d="M164 92 L186 114 M186 92 L164 114" stroke="#c0452c" stroke-width="8" stroke-linecap="round"/>
  <!-- کوه کوچک -->
  <path d="M84 110 L100 86 L116 110 Z" fill="#e8cfa0" stroke="#b5673a" stroke-width="5" stroke-linejoin="round"/>
</svg>
