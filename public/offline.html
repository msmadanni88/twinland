<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>TwinLand · اینترنت در دسترس نیست</title>
<!--
  صفحه بدون اینترنت — سرویس‌ورکر وقتی اینترنت نیست همین را نشان می‌دهد.
  • خودش هر چند ثانیه و با برگشتن اینترنت اتصال را می‌سنجد و بدون ضربه کاربر صفحه را دوباره باز می‌کند.
  • یک بازی خیلی کوچک دارد: فنجان TwinLand از روی مانع‌ها می‌پرد. با ضربه، فاصله یا کلید بالا می‌پرد.
  • ظاهر از نسخه فعال سایت پیروی می‌کند: در v4.0 سیاه و سفید با حالت روشن یا تیره کاربر، در نسخه‌های قبل همان رنگ‌های قبلی.
    نسخه فعال و حالت را UiVersionProvider و تنظیم حالت در حافظه مرورگر نگه می‌دارند.
-->
<style>
  :root{--bg:#f6f7fb;--card:#fff;--text:#1e293b;--sub:#64748b;--accent:#0284c7;--on:#fff;--hair:rgba(0,0,0,.08);--r:22px;--track:rgba(0,0,0,.08)}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1222;--card:#181c33;--text:#f8fafc;--sub:#94a3b8;--accent:#38bdf8;--on:#0f1222;--hair:rgba(255,255,255,.1);--track:rgba(255,255,255,.12)}}
  html.v4{--r:16px}
  html.v4.light{--bg:#F3F3F4;--card:rgba(255,255,255,.72);--text:#0A0A0A;--sub:#55555C;--accent:#0A0A0A;--on:#FFFFFF;--hair:rgba(0,0,0,.07);--track:rgba(0,0,0,.14)}
  html.v4.dark{--bg:#050506;--card:rgba(16,16,18,.72);--text:#F4F4F5;--sub:#A6A6AE;--accent:#F4F4F5;--on:#0A0A0A;--hair:rgba(255,255,255,.10);--track:rgba(255,255,255,.18)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);
    font-family:'Estedad','Vazirmatn',Tahoma,system-ui,sans-serif}
  .c{width:100%;max-width:380px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:26px 20px 20px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.04),0 22px 56px rgba(0,0,0,.10);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
  .ic{width:56px;height:56px;margin:0 auto;border-radius:var(--r);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--text)}
  h1{font-size:17px;font-weight:900;margin:14px 0 16px;line-height:1.6}
  canvas{display:block;width:100%;height:auto;border-radius:var(--r);border:1px solid var(--hair);touch-action:manipulation;cursor:pointer;outline:none}
  canvas:focus-visible{box-shadow:0 0 0 3px var(--track)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--sub);margin:8px 2px 16px;font-variant-numeric:tabular-nums}
  button{width:100%;height:46px;border:1px solid transparent;border-radius:var(--r);background:var(--accent);color:var(--on);font:inherit;font-size:14px;font-weight:900;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s cubic-bezier(.34,1.56,.64,1),opacity .2s}
  button:active{transform:scale(.97)}
  button[disabled]{opacity:.6;cursor:default}
  .st{font-size:11.5px;color:var(--sub);margin-top:10px;min-height:20px;display:flex;align-items:center;justify-content:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:p 1.4s ease-in-out infinite}
  .ok .dot{background:#34C759;animation:none}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes s{to{transform:rotate(360deg)}}
  .spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite}
  @media (prefers-reduced-motion:reduce){.dot,.spin{animation:none}}
</style>
<script>
  // ظاهر پیش از نقاشی صفحه انتخاب می‌شود تا رنگ نپرد
  (function(){try{
    var ui=localStorage.getItem('tl_ui_active')||document.documentElement.getAttribute('data-ui')||'';
    if(ui==='v4.0'||ui==='v5.0'){var m=localStorage.getItem('tl_thememode')==='light'?'light':'dark';document.documentElement.className='v4 '+m;
      document.querySelector('meta[name=theme-color]').setAttribute('content',m==='light'?'#F3F3F4':'#050506')}
  }catch(e){}})()
</script>
</head>
<body>
  <main class="c">
    <div class="ic" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 8.5a14 14 0 0 1 4.6-2.7M10.8 5.1A14 14 0 0 1 21.5 8.5M5.5 12a9.5 9.5 0 0 1 3.4-2M15 10.2a9.5 9.5 0 0 1 3.5 1.8M9 15.5a4.5 4.5 0 0 1 6 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none"/><path d="M3.5 3.5l17 17"/>
      </svg>
    </div>
    <h1>اینترنت در دسترس نیست</h1>
    <canvas id="g" width="640" height="200" tabindex="0" aria-label="بازی کوچک: با ضربه یا کلید فاصله، فنجان از روی مانع می‌پرد"></canvas>
    <div class="row"><span id="sc">امتیاز ۰</span><span id="hi"></span></div>
    <button id="retry" type="button">تلاش دوباره</button>
    <div class="st" id="st" role="status" aria-live="polite"><span class="dot"></span><span id="stt">منتظر اینترنت…</span></div>
  </main>
<script>
(function(){
  var fa=function(n){try{return Number(n).toLocaleString('fa')}catch(e){return String(n)}};
  // ── اتصال دوباره، خودکار ─────────────────────────────
  var btn=document.getElementById('retry'),st=document.getElementById('st'),stt=document.getElementById('stt'),busy=false,timer=null,delay=3000;
  function probe(manual){
    if(busy)return;busy=true;
    if(manual){btn.disabled=true;btn.innerHTML='<span class="spin"></span>در حال بررسی…'}
    fetch('/robots.txt?ping='+Date.now(),{cache:'no-store'}).then(function(r){
      if(r&&(r.ok||r.status<500)){st.className='st ok';stt.textContent='اینترنت برگشت؛ در حال باز کردن…';setTimeout(function(){location.reload()},350);return}
      fail(manual)
    }).catch(function(){fail(manual)});
  }
  function fail(manual){
    busy=false;
    if(manual){btn.disabled=false;btn.textContent='تلاش دوباره';stt.textContent='هنوز وصل نیست؛ خودش دوباره امتحان می‌کند'}
    schedule();
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(function(){probe(false)},document.hidden?10000:delay);delay=Math.min(delay*1.4,15000)}
  btn.addEventListener('click',function(){delay=3000;probe(true)});
  window.addEventListener('online',function(){delay=3000;probe(false)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){delay=3000;probe(false)}});
  schedule();

  // ── بازی فنجان ───────────────────────────────────────
  var cv=document.getElementById('g'),x=cv.getContext('2d'),W=640,H=200,G=162;
  var sc=document.getElementById('sc'),hi=document.getElementById('hi'),best=0;
  try{best=Number(localStorage.getItem('tl_offline_best'))||0}catch(e){}
  function showBest(){hi.textContent=best?'بهترین '+fa(best):''}showBest();
  var cup,obs,beans,t,speed,score,state,last=0;
  function reset(){cup={y:G,v:0};obs=[];beans=[];t=0;speed=4.2;score=0;state='ready'}
  reset();
  function col(){return getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#111'}
  function sub(){return getComputedStyle(document.documentElement).getPropertyValue('--sub').trim()||'#777'}
  function jump(){
    if(state==='ready'||state==='over'){if(state==='over')reset();state='run';cup.v=-11;return}
    if(cup.y>=G-0.5)cup.v=-11;
  }
  cv.addEventListener('pointerdown',function(e){e.preventDefault();jump()});
  cv.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'||e.key===' '){e.preventDefault();jump()}});
  window.addEventListener('keydown',function(e){if(document.activeElement!==cv&&(e.code==='Space'||e.code==='ArrowUp')){e.preventDefault();jump()}});
  function drawCup(cx,cy,c){ // فنجان خطی، پایه روی زمین
    x.strokeStyle=c;x.lineWidth=3;x.lineJoin='round';x.lineCap='round';
    x.beginPath();x.moveTo(cx-14,cy-22);x.lineTo(cx+12,cy-22);x.lineTo(cx+12,cy-9);x.quadraticCurveTo(cx+12,cy,cx-1,cy);x.quadraticCurveTo(cx-14,cy,cx-14,cy-9);x.closePath();x.stroke();
    x.beginPath();x.arc(cx+15,cy-15,5,-Math.PI/2,Math.PI/2);x.stroke();
    var w=Math.sin(t/6)*2;x.beginPath();x.moveTo(cx-6,cy-28);x.quadraticCurveTo(cx-9+w,cy-33,cx-6,cy-38);x.moveTo(cx+3,cy-28);x.quadraticCurveTo(cx+w,cy-33,cx+3,cy-38);x.stroke();
  }
  function drawPin(o,c){ // مانع: نشانگر نقشه
    var h=o.h;x.strokeStyle=c;x.lineWidth=3;x.beginPath();
    x.moveTo(o.x,G);x.bezierCurveTo(o.x-o.w/2,G-h*.45,o.x-o.w/2,G-h,o.x,G-h);x.bezierCurveTo(o.x+o.w/2,G-h,o.x+o.w/2,G-h*.45,o.x,G);x.stroke();
    x.beginPath();x.arc(o.x,G-h*.7,3,0,Math.PI*2);x.stroke();
  }
  function frame(ts){
    requestAnimationFrame(frame);
    if(ts-last<14)return;last=ts;
    var c=col(),s=sub();
    x.clearRect(0,0,W,H);
    // زمین خط‌چین
    x.strokeStyle=s;x.lineWidth=2;x.setLineDash([10,8]);x.lineDashOffset=state==='run'?(t*speed)%18:0;
    x.beginPath();x.moveTo(0,G+2);x.lineTo(W,G+2);x.stroke();x.setLineDash([]);
    if(state==='run'){
      t++;speed=Math.min(10,4.2+t/700);
      cup.v+=0.62;cup.y=Math.min(G,cup.y+cup.v);
      if(t%Math.max(48,Math.round(110-t/40))===0&&Math.random()<0.8)obs.push({x:W+20,w:22,h:26+Math.random()*18});
      if(t%95===0)beans.push({x:W+20,y:G-60-Math.random()*40});
      obs.forEach(function(o){o.x-=speed});beans.forEach(function(b){b.x-=speed});
      obs=obs.filter(function(o){return o.x>-30});beans=beans.filter(function(b){return b.x>-20&&!b.got});
      var px=90;
      obs.forEach(function(o){if(Math.abs(o.x-px)<(o.w/2+11)&&cup.y>G-o.h+6){state='over'}});
      beans.forEach(function(b){if(Math.abs(b.x-px)<16&&Math.abs(b.y-(cup.y-14))<20){b.got=true;score+=5}});
      if(t%10===0)score++;
      if(state==='over'&&score>best){best=score;try{localStorage.setItem('tl_offline_best',String(best))}catch(e){}showBest()}
      sc.textContent='امتیاز '+fa(score);
    }
    obs.forEach(function(o){drawPin(o,c)});
    beans.forEach(function(b){x.fillStyle=c;x.beginPath();x.ellipse(b.x,b.y,5,7,0.5,0,Math.PI*2);x.fill();x.strokeStyle=document.documentElement.classList.contains('light')?'#fff':'rgba(0,0,0,.6)';x.lineWidth=1.4;x.beginPath();x.moveTo(b.x-2,b.y-5);x.quadraticCurveTo(b.x+2,b.y,b.x-1,b.y+5);x.stroke()});
    drawCup(90,cup.y,c);
    if(state!=='run'){
      x.fillStyle=s;x.font='bold 22px Estedad, Vazirmatn, Tahoma, sans-serif';x.textAlign='center';x.direction='rtl';
      x.fillText(state==='over'?'خوردی به نشانگر! دوباره بزن':'تا اینترنت برگردد، بزن تا فنجان بپرد',W/2,58);
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
